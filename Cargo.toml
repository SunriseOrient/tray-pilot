[package]
name = "tray-pilot"
version = "0.1.0"
edition = "2021"
description = "Windows 托盘常用动作工具"
license = "MIT"

[dependencies]
ab_glyph = "0.2"
base64 = "0.22"
directories = "6"
eframe = { version = "0.37", default-features = false, features = [
    "glow",
    "default_fonts",
    "system_fonts",
    "clipboard",
] }
egui = "0.37"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tray-icon = "0.26"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_UI_HiDpi",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
strip = true
